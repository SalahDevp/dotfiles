# s: show sessions
# d: detach from session
# c: create window (switch using n,p or numbers)

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
#Change default prefix to ctrl-a
set -g prefix C-s
unbind C-b
bind-key C-s send-prefix

# Change horizental splitting to |
unbind %
bind \\ split-window -h -c "#{pane_current_path}" #open new pane in current path

# Change vertical splitting to -
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Refresh config 
unbind r
bind r source-file ~/.tmux.conf

# Enable mouse 
set -g mouse on

# Resize panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind m resize-pane -Z

# Enable vim copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
unbind -T copy-mode-vi MouseDragEnd1Pane # prevent from exiting exit copy mode after dragging with mouse

set-option -g status-position top
set -g @catppuccin_window_status_style "custom"

# Plugins use prefix + I to install plugins
# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

##### list of tmux plugins

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'


set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'catppuccin/tmux'

# Catppuccin (theme) config
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"


set -g @catppuccin_window_left_separator "#[bg=default,fg=#{@thm_surface_0}]#[bg=#{@thm_surface_0},fg=#{@thm_fg}]"
set -g @catppuccin_window_right_separator "#[bg=default,fg=#{@thm_surface_0}]"
set -g @catppuccin_window_current_left_separator "#[bg=default,fg=#{@thm_mauve}]#[bg=#{@thm_mauve},fg=#{@thm_bg}]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_mauve}]█"
set -g @catppuccin_window_current_right_separator "#[bg=default,fg=#{@thm_surface_1}]"

# Key transparency settings
set -g @catppuccin_status_background "none"


set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
